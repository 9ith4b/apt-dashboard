name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web format:check
      - run: pnpm --filter web lint
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web test
      - run: pnpm --filter web build
      - run: pnpm --filter web budget

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: python -m pip install --upgrade pip && python -m pip install -e "apps/api[dev]"
      - run: ruff format --check apps/api
      - run: ruff check apps/api
      - run: pytest apps/api
      - run: mypy apps/api/src
      - run: python apps/api/scripts/export_openapi.py --check

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose model
        env:
          POSTGRES_PASSWORD: ci-only-password
          MINIO_ROOT_PASSWORD: ci-only-password
        run: docker compose -f infra/compose.yaml config --quiet
      - name: Validate shell scripts
        run: bash -n infra/scripts/*.sh
      - name: Validate Prometheus configuration
        run: |
          docker run --rm \
            --entrypoint promtool \
            -v "$PWD/infra/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 \
            check config /etc/prometheus/prometheus.yml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: python -m pip install --upgrade pip && python -m pip install -e "apps/api[dev]"
      - run: bandit -q -r apps/api/src
      - run: pip-audit

  e2e:
    runs-on: ubuntu-latest
    needs: [web, api, compose]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start isolated application stack
        working-directory: infra
        run: |
          cp .env.example .env
          docker compose up -d --build
          ./scripts/release-check.sh
      - name: Create isolated E2E administrator
        working-directory: infra
        run: |
          docker compose exec -T \
            -e APT_HUNTER_NEW_USER_PASSWORD=ci-e2e-password-keep-private \
            api python -m apt_hunter.cli create-user \
            --username e2e-admin --display-name "Admin" --role admin
      - name: Run desktop, mobile, accessibility, performance and visual E2E
        env:
          APT_HUNTER_E2E_BASE_URL: http://127.0.0.1:8180
          APT_HUNTER_E2E_USERNAME: e2e-admin
          APT_HUNTER_E2E_PASSWORD: ci-e2e-password-keep-private
        run: pnpm --filter web e2e
      - if: always()
        working-directory: infra
        run: mkdir -p ../apps/web/test-results && docker compose logs --no-color > ../apps/web/test-results/compose.log || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
      - if: always()
        working-directory: infra
        run: docker compose down -v

  images:
    runs-on: ubuntu-latest
    needs: [web, api, compose, security, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: false
          tags: apt-hunter-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: apt-hunter-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
