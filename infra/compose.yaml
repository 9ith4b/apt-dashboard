name: apt-hunter

services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apt_hunter}
      POSTGRES_USER: ${POSTGRES_USER:-apt_hunter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [backend]

  redis:
    image: redis:7.4.9-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data
    networks: [backend]

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-apt_hunter}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - minio-data:/data
    networks: [backend]

  migrate:
    build:
      context: ../apps/api
    command: ["alembic", "upgrade", "head"]
    environment: &api-environment
      APT_HUNTER_ENVIRONMENT: production
      APT_HUNTER_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-apt_hunter}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-apt_hunter}
      APT_HUNTER_REDIS_URL: redis://redis:6379/0
      APT_HUNTER_MINIO_ENDPOINT: minio:9000
      APT_HUNTER_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-apt_hunter}
      APT_HUNTER_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      APT_HUNTER_MINIO_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    restart: "no"

  api:
    build:
      context: ../apps/api
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]

  worker:
    build:
      context: ../apps/api
    command: ["celery", "-A", "apt_hunter.worker.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=${WORKER_CONCURRENCY:-1}"]
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [backend]

  beat:
    build:
      context: ../apps/api
    command: ["celery", "-A", "apt_hunter.worker.celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    environment: *api-environment
    depends_on:
      redis:
        condition: service_healthy
    networks: [backend]

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-8180}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks: [backend]

networks:
  backend:

volumes:
  postgres-data:
  redis-data:
  minio-data:
